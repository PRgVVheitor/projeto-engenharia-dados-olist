resources:
  jobs:
    pipeline_olist:
      name: pipeline_olist

      schedule:
        quartz_cron_expression: "40 0 13 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/heitorvini79@gmail.com/Atividade_land_to_bronze
            source: WORKSPACE

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/heitorvini79@gmail.com/Atividade_bronze_to_silver
            source: WORKSPACE

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/heitorvini79@gmail.com/Atividade_silver_to_gold
            source: WORKSPACE

      queue:
        enabled: true

      performance_target: PERFORMANCE_OPTIMIZED